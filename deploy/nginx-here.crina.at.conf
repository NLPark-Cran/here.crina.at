limit_req_zone $binary_remote_addr zone=crina_api:10m rate=10r/s;

# HTTP → HTTPS
server {
    listen 80;
    server_name here.crina.at;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name here.crina.at;

    ssl_certificate /etc/letsencrypt/live/here.crina.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/here.crina.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/workspace/test0607/here.crina.at/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # 聊天与发帖接口限流（防刷，SSE 长连接不受影响）
    location /api/chat/ {
        limit_req zone=crina_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 生成素材（立绘/头像/氛围片）
    location ^~ /assets/ {
        alias /root/workspace/test0607/here.crina.at/assets/generated/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|mp3|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
